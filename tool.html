<!doctype html>
<!--
  tool.html - the platform shell that runs one tool under the top bar.
  Serves: contract 4 (Tool kit) and 6 (Releases). Must not change: uploaded
  code is untrusted, always. It runs only inside the sealed frame hosted by
  frame.html, never in this page; this page holds the session, the tool never
  sees it. The only frame this page may show is this site's own frame.html.
  The security policy stays the first element of the head.
-->
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://ggpwitbuhxqgcfexsnbf.supabase.co; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Tool - DAME</title>
<link rel="icon" href="kit/v1/icon.svg">
<link rel="stylesheet" href="kit/v1/dame.css">
<link rel="stylesheet" href="kit/v1/shell.css">
<script src="kit/v1/config.js" defer></script>
<script src="kit/v1/api.js" defer></script>
<script src="kit/v1/shell.js" defer></script>
<script src="pages/tool.js" defer></script>
</head>
<body class="hub-runner" data-page="tool" data-title="Tool">
<div class="hub-strip" id="strip" hidden>
  <nav class="hub-trail" aria-label="Where you are">
    <a id="crumb-hub" href="hub.html">Hub</a><span aria-hidden="true">/</span><a id="back" href="hub.html">Space</a><span aria-hidden="true">/</span><b id="crumb-tool"></b>
  </nav>
  <span class="hub-pill" id="preview-pill" hidden></span>
  <a id="admin" href="hub.html" hidden>Tool admin</a>
</div>
<div class="hub-ask" id="ask" role="alertdialog" aria-labelledby="ask-text" hidden>
  <span id="ask-text"></span>
  <span class="hub-ask-url" id="ask-url"></span>
  <button class="dame-btn dame-btn-primary hub-small" type="button" id="ask-yes">Open in a new tab</button>
  <button class="dame-btn hub-small" type="button" id="ask-no">Stay here</button>
</div>
<div class="hub-ask" id="oops" role="status" hidden>
  <span class="hub-ask-url" id="oops-text"></span>
  <button class="dame-btn dame-btn-primary hub-small" type="button" id="oops-copy" hidden>Copy for the AI</button>
  <button class="dame-btn hub-small" type="button" id="oops-close">Close</button>
</div>
<main class="dame-page" id="main" hidden>
  <p class="dame-card hub-msg" id="msg" role="alert" hidden></p>
  <div class="dame-card" id="notbuilt" hidden>
    <h1 id="notbuilt-title"></h1>
    <p id="notbuilt-text"></p>
    <a class="dame-btn dame-btn-primary" id="notbuilt-go" href="hub.html" hidden>Build this tool</a>
  </div>
  <p><a id="back2" href="hub.html">Back to the space</a></p>
</main>
<iframe class="hub-frame" id="frame" title="Tool" hidden></iframe>
</body>
</html>
