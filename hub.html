  hub.html - the dashboard: the spaces a signed-in user may open, as tiles.

-->
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://ggpwitbuhxqgcfexsnbf.supabase.co; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<link rel="preconnect" href="https://ggpwitbuhxqgcfexsnbf.supabase.co" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Hub - DAME</title>
<link rel="icon" href="kit/v1/icon.svg">
<link rel="stylesheet" href="kit/v1/dame.css">
<link rel="stylesheet" href="kit/v1/shell.css">

<body data-page="hub" data-title="Hub">
<main class="dame-page" id="main" hidden>
  <h1 id="hello">Hub</h1>
  <p class="dame-muted">Your spaces. Each tile is one department.</p>
  <p class="dame-card hub-msg" id="msg" role="alert" hidden></p>
  <div class="hub-tiles" id="spaces"></div>
  <p class="dame-empty" id="empty" hidden>You have no spaces yet. An IT admin creates a space; its admin then adds you or gives you a tool.</p>
  <div class="dame-card" id="it-card" hidden>
    <h2>IT admin</h2>
    <p class="dame-muted">Approve new accounts, switch accounts off, set the site rules, read the audit.</p>
    <a class="dame-btn dame-btn-primary" href="admin/it.html">Open IT admin</a>
  </div>
</main>
