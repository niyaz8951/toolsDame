<!doctype html>
<!--
  examples/converter/index.html - a stand-alone example tool: it calculates in
  the browser and saves nothing. Load it from the builder ("Load an example").
  Serves: contract 4 (Tool kit) and the site rules every tool follows.
  Must not change: one file; the two kit lines; no header, sign-in or outside
  address; only building blocks of dame.css.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Converter</title>
<link rel="stylesheet" href="/_dame/v1/dame.css">
<script src="/_dame/v1/dame.js"></script>
<style>
  /* Only what the building blocks do not cover. No fonts, no colours. */
</style>
</head>
<body>
<main class="dame-page">
  <div class="dame-head">
    <h1>Converter</h1>
    <p id="hello">Cooling capacity and airflow, converted as you type. Nothing is saved.</p>
  </div>

  <section class="dame-card">
    <div class="dame-card-head">
      <h2>What do you want to convert?</h2>
      <div class="dame-toggle" role="group" aria-label="What to convert" id="kind">
        <button type="button" data-kind="capacity" aria-pressed="true">Cooling capacity</button>
        <button type="button" data-kind="airflow" aria-pressed="false">Airflow</button>
      </div>
    </div>
    <div class="dame-grid" id="fields"></div>
    <p class="dame-hint">Type a value in any box; the others follow.</p>
    <div class="dame-row">
      <button class="dame-btn" type="button" id="clear">Clear</button>
      <button class="dame-btn dame-btn-primary" type="button" id="save">Download these values</button>
    </div>
  </section>

  <section class="dame-card">
    <div class="dame-card-head"><h2>Result</h2></div>
    <p class="dame-empty" id="empty">Nothing typed yet. Type a value above.</p>
    <div class="dame-stats" id="stats" hidden></div>
  </section>
</main>

<script>
(function () {
  'use strict';

  // Each unit as "how many of the base unit". Base: kW for capacity, L/s for airflow.
  var KINDS = {
    capacity: [['kW', 1], ['TR', 3.5168525], ['Btu/h', 1 / 3412.142], ['kcal/h', 1 / 859.845]],
    airflow: [['L/s', 1], ['m3/h', 1 / 3.6], ['CFM', 0.4719474], ['m3/s', 1000]]
  };
  var kind = 'capacity';
  var inputs = [];
  var $ = function (id) { return document.getElementById(id); };

  function round(n) { return n === 0 ? '0' : String(Number(n.toPrecision(6))); }

  function build() {
    var box = $('fields');
    box.textContent = '';
    inputs = KINDS[kind].map(function (unit, i) {
      var label = document.createElement('label');
      label.className = 'dame-field';
      label.textContent = unit[0];
      var input = document.createElement('input');
      input.className = 'dame-input';
      input.type = 'number';
      input.min = '0';
      input.step = 'any';
      input.inputMode = 'decimal';
      input.addEventListener('input', function () { convert(i); });
      label.appendChild(input);
      box.appendChild(label);
      return input;
    });
    show(null);
  }

  function convert(from) {
    var v = parseFloat(inputs[from].value);
    if (isNaN(v) || v < 0) { show(null); return; }
    var base = v * KINDS[kind][from][1];
    inputs.forEach(function (input, i) {
      if (i !== from) input.value = round(base / KINDS[kind][i][1]);
    });
    show(base);
  }

  function show(base) {
    var stats = $('stats');
    stats.textContent = '';
    stats.hidden = base === null;
    $('empty').hidden = base !== null;
    if (base === null) return;
    KINDS[kind].forEach(function (unit) {
      var d = document.createElement('div');
      d.className = 'dame-stat';
      var b = document.createElement('b');
      b.textContent = round(base / unit[1]);
      var s = document.createElement('span');
      s.textContent = unit[0];
      d.append(b, s);
      stats.appendChild(d);
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('#kind button'), function (b) {
    b.addEventListener('click', function () {
      kind = b.getAttribute('data-kind');
      Array.prototype.forEach.call(b.parentNode.children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      build();
    });
  });
  $('clear').addEventListener('click', build);
  $('save').addEventListener('click', function () {
    if ($('stats').hidden) { Dame.toast('Type a value first.'); return; }
    var lines = KINDS[kind].map(function (unit, i) { return unit[0] + ',' + inputs[i].value; });
    Dame.download('conversion.csv', 'Unit,Value\r\n' + lines.join('\r\n'), 'text/csv');
  });

  Dame.ready().then(function (me) {
    $('hello').textContent = 'Hello, ' + me.name + '. Cooling capacity and airflow, converted as you type. Nothing is saved.';
  });
  build();
})();
</script>
</body>
</html>
