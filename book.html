<!doctype html>
<!--
  book.html - the site book: the whole site explained, to read chapter by
  chapter or to show as a presentation.
  Serves: "On every page" (help) and the owner's wish of 2026-11-26 that the
  site explains itself, with no separate presentation.
  Must not change: the text lives in book/*.md and book/index.json, is written
  to the page as text (never as HTML), and holds no key, address or personal
  data. Only signed-in, approved people can open it. The security policy stays
  the first element of the head.
-->
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://ggpwitbuhxqgcfexsnbf.supabase.co; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<link rel="preconnect" href="https://ggpwitbuhxqgcfexsnbf.supabase.co" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Site book - DAME</title>
<link rel="icon" href="kit/v1/icon.svg">
<link rel="stylesheet" href="kit/v1/dame.css">
<link rel="stylesheet" href="kit/v1/shell.css">
<script src="kit/v1/theme.js"></script>
<script src="kit/v1/config.js" defer></script>
<script src="kit/v1/api.js" defer></script>
<script src="kit/v1/shell.js" defer></script>
<script src="pages/book.js" defer></script>
</head>
<body data-page="book" data-title="Site book">
<main class="dame-page" id="main" hidden>
  <div class="hub-hero">
    <a class="dame-btn hub-small hub-back" href="hub.html">Back to the hub</a>
    <h1>Site book</h1>
    <p>The whole site explained. First an overview for everyone; then, for IT, how each thing is done, why it was decided that way, what was left out, and its limits. Read it, or show it as a presentation.</p>
    <div class="dame-row hub-hero-row">
      <button class="dame-btn dame-btn-primary" type="button" id="present-all">Present the overview</button>
      <button class="dame-btn" type="button" id="present-detail">Present the detail for IT</button>
      <button class="dame-btn" type="button" id="present-one">Present this chapter</button>
    </div>
  </div>
  <p class="dame-card hub-msg" id="msg" role="alert" hidden></p>
  <div class="hub-book">
    <nav class="hub-book-nav" aria-label="Chapters"><ol id="chapters"></ol></nav>
    <article class="dame-card hub-book-page" id="page" aria-live="polite"></article>
  </div>
  <div class="dame-row hub-book-foot">
    <button class="dame-btn" type="button" id="prev">Previous chapter</button>
    <button class="dame-btn dame-btn-primary" type="button" id="next">Next chapter</button>
  </div>
</main>
</body>
</html>
